<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>K-AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;display:flex;height:100vh}
.menu{width:230px;background:#171717;padding:15px;display:flex;flex-direction:column;gap:10px}
.menu b{font-size:19px}
.menu button{background:#222;color:#fff;border:0;padding:11px;border-radius:10px;text-align:left;font-size:14px}
.menu button:hover{background:#333}
.menu small{color:#aaa;font-size:12px;margin-top:10px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{padding:15px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.top span{color:#4ade80;font-size:13px}
.chat{flex:1;padding:15px;overflow:auto}
.msg{background:#1e1e1e;padding:13px;border-radius:12px;margin-bottom:10px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg img{width:100%;border-radius:12px;margin-top:10px}
.msg code{background:#000;padding:2px 6px;border-radius:6px}
.input{display:flex;gap:10px;padding:12px;border-top:1px solid #222}
.input input{flex:1;padding:13px;border-radius:20px;border:0;background:#222;color:#fff;outline:none;font-size:15px}
.input button{padding:12px 18px;border-radius:20px;border:0;background:#fff;color:#000;font-weight:bold;font-size:16px}
@media(max-width:700px){.menu{display:none}}
</style>
</head>
<body>
<div class="menu">
<b>⚡ K-AI</b>
<button onclick="pedir('Cria um app de treino')">📁 Projetos</button>
<button>💬 Conversas</button>
<button onclick="pedir('Cria um design / landing page')">🎨 Design</button>
<button>⚙️ Configurações</button>
<button onclick="instalar()">⬇️ Instalar App</button>
<small id="status">Conectando...</small>
<small>K-AI FUSÃO<br>Gemini + Groq + Pollinations<br>1 única IA evoluída</small>
</div>

<div class="main">
<div class="top"><b>K-AI - App Mãe</b><span>● FUSÃO ATIVA</span></div>
<div class="chat" id="chat"></div>
<div class="input">
<input id="txt" placeholder="Pede pro K-AI criar algo...">
<button onclick="enviar()">➤</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://tgccyqvobdmwmwjwntxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_2EneNKkowoLF9UiWwB1DDA_Z_RvwPfX";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredPrompt=e;});
function instalar(){ if(deferredPrompt){deferredPrompt.prompt()} else {alert('No Chrome: 3 pontinhos > Adicionar à tela inicial')} }

function pedir(texto){ document.getElementById('txt').value = texto; enviar(); }

async function salvar(role, message){
  const {error} = await supabaseClient.from('k_ai_chats').insert({role, message});
  if(error) console.log('Supabase erro:', error.message);
}

async function carregar(){
  const {data} = await supabaseClient.from('k_ai_chats').select('*').order('created_at',{ascending:true}).limit(50);
  let c=document.getElementById('chat');
  if(!data || data.length===0){
    c.innerHTML=`<div class="msg"><b>K-AI ⚡:</b> Fusão ativa! Gemini + Groq + Pollinations pensando como 1 única IA mais evoluída. O que vamos criar hoje?</div>`;
    document.getElementById('status').innerText='✅ Supabase conectado';
    return;
  }
  c.innerHTML='';
  data.forEach(m=>{
    c.innerHTML+=`<div class="msg"><b>${m.role==='user'?'Você':'K-AI ⚡'}:</b> ${m.message}</div>`;
  });
  document.getElementById('status').innerText='✅ Supabase conectado - '+data.length+' msgs salvas';
  c.scrollTop=c.scrollHeight;
}

async function enviar(){
  let v=document.getElementById('txt').value.trim(); if(!v) return;
  let c=document.getElementById('chat');
  c.innerHTML+=`<div class="msg"><b>Você:</b> ${v}</div>`;
  await salvar('user', v);
  document.getElementById('txt').value='';
  c.innerHTML+=`<div class="msg" id="loading"><b>K-AI FUSÃO:</b> Gemini + Groq + Pollinations pensando juntos...</div>`;
  c.scrollTop=c.scrollHeight;

  try{
    const res = await fetch(SUPABASE_URL + "/functions/v1/k-ai", {
      method: "POST",
      headers: { "Authorization": "Bearer "+SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: v })
    });
    const data = await res.json();
    document.getElementById('loading')?.remove();
    let html = `<div class="msg"><b>K-AI ⚡:</b> ${(data.resposta||"Sem resposta").replace(/\n/g,'<br>')}</div>`;
    if(data.imagem) html += `<div class="msg"><b>K-AI Imagem:</b><br><img src="${data.imagem}"></div>`;
    c.innerHTML+=html;
    await salvar('assistant', data.resposta || "");
  }catch(e){
    document.getElementById('loading')?.remove();
    c.innerHTML+=`<div class="msg"><b>K-AI:</b> Erro ao conectar na fusão. Confere se fez Deploy da função k-ai no Supabase.</div>`;
  }
  c.scrollTop=c.scrollHeight;
}

document.getElementById('txt').addEventListener('keydown', e=>{ if(e.key==='Enter') enviar(); });

carregar();
</script>
</body>
</html>
